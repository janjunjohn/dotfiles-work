#set -g default-terminal "tmux-256color"
set -g default-terminal "xterm-256color"
#set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"
# SSH 越しでもローカル端末のクリップボードへコピーするため OSC 52 を有効化。
# コピー操作時に tmux が OSC 52 を外側の端末へ送る（端末側の OSC 52 対応が前提）。
set -s set-clipboard on
set -ga terminal-features ",xterm-256color:clipboard"
# action key
unbind C-b
set-option -g prefix C-t
set-option -g repeat-time 0
set-option -g focus-events on

#### Key bindings

bind \\ split-window -h
bind - split-window -v


#bind t send-key C-t
# Reload settings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
# Open current directory
bind o run-shell "open #{pane_current_path}"

# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# vim mode settings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
# ヤンクは yank.sh 経由。display-popup（claude セッション）内では tmux が OSC 52
# を外側へ中継しないため、set-clipboard on だけではポップアップからローカルへ
# コピーできない。yank.sh はポップアップを介さず本物の外側端末へ直接 OSC 52 を
# 書き込み、加えてローカル実行向けに pbcopy も行う。
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "~/.config/tmux/yank.sh"

# Moving window: prefix + H（左へ）/ prefix + L（右へ）。
# -d で移動したウィンドウにフォーカスを追従させる（小文字 h/l はペイン移動、
# 大文字 H/L でウィンドウごと移動、と一貫）。L の既定 switch-client -l は
# ほぼ使わないため上書き。
#
# 以前は Ctrl-P / Ctrl-N に割り当てていたが、SSH 経由だとリモート端末側で
# Ctrl 系が横取り（または CSI u で別表現に）され tmux まで届かず無反応になる。
# H/L は素の印字文字でどの端末・SSH でも確実に届くため、こちらに一本化した。
bind-key H swap-window -d -t -1
bind-key L swap-window -d -t +1

# Resizing pane
bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5

#### basic settings

set-option -g status-justify "left"
#set-option utf8-default on
#set-option -g mouse-select-pane
set-window-option -g mode-keys vi
#set-window-option -g utf8 on
# look'n feel
set-option -g status-fg cyan
set-option -g status-bg black
set -g pane-active-border-style fg=colour166,bg=default
set -g window-style fg=default,bg=default
set -g window-active-style fg=default,bg=default
set-option -g history-limit 64096

set -sg escape-time 10

#### COLOUR

# default statusbar colors
set-option -g status-style bg=colour235,fg=colour136,default

# default window title colors
set-window-option -g window-status-style fg=colour244,bg=colour234,dim

# active window title colors
set-window-option -g window-status-current-style fg=colour166,bg=default,bright

# pane border
set-option -g pane-border-style fg=colour235 #base02
set-option -g pane-active-border-style fg=colour136,bg=colour235

# message text
set-option -g message-style bg=colour235,fg=colour166

# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange

# clock
set-window-option -g clock-mode-colour colour64 #green

# allow the title bar to adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#T"

# import
# if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"

source ~/.config/tmux/statusline.conf
source ~/.config/tmux/utility.conf

#### Plugins (tpm)
# tpm and plugins live OUTSIDE this repo (~/.tmux/plugins) so the clones are not
# committed. tpm itself is cloned by scripts/install.sh. After a fresh install,
# press `prefix + I` once inside tmux to fetch the plugins below.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'
# craftzdog's Claude Code session manager:
#   prefix + y  launch/attach a claude session for the current directory
#   prefix + u  fzf picker over every running claude session, with live
#               working / waiting / idle status (status needs Claude Code hooks)
set -g @plugin 'craftzdog/tmux-claude-session-manager'
# The session manager spawns `claude` directly (not via a login shell), so it
# relies on the tmux server's PATH. A launchd-started server has a minimal PATH
# without ~/.local/bin, so `prefix + y` would fail. Point it at the native binary
# by absolute path (~ is expanded by the shell that runs the command).
set -g @claude_command '~/.local/bin/claude'
# Persist & auto-restore sessions across a Mac mini reboot.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Keep this as the very last line.
run '~/.tmux/plugins/tpm/tpm'
